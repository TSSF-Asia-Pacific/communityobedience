---
name: STAGING Build & Deploy Static Site (Master Branch deployed to Staging env)

on:
    workflow_dispatch:
    push:
        branches:
            - master

env:
    URL: tssf-asia-pacific.github.io/communityobedience-staging/
    APP_BASE_PATH: /communityobedience-staging/

jobs:
    build:
        name: Build Static Site Staging
        runs-on: ubuntu-24.04
        environment:
            name: staging
            url: https://${{ env.URL }}

        steps:
            - uses: actions/checkout@v2
              with:
                  fetch-depth: 0
                  ref: master

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: yarn

            - run: yarn install

            - name: Typecheck
              run: yarn typecheck

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: /tmp/composer-cache
                  key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

            - name: Install dependencies
              uses: php-actions/composer@v6
              with:
                  dev: no
                  php_version: '8.4'

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'

            - name: Build
              run: yarn run build

            - name: Deploy
              uses: peaceiris/actions-gh-pages@v3
              with:
                  external_repository: >-
                      TSSF-Asia-Pacific/communityobedience-staging
                  deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
                  publish_dir: ./dist
