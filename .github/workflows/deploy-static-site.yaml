---
name: Build & Deploy Static Site

on:
    workflow_call:
        inputs:
            environment:
                type: string
                required: true
            url:
                type: string
                required: true
            app_base_path:
                type: string
                required: false
                default: /
            external_repository:
                type: string
                required: false
                default: ''
            cname:
                type: string
                required: false
                default: ''
        secrets:
            deploy_key:
                required: false

permissions:
    contents: write

jobs:
    build:
        name: Build and deploy static site
        runs-on: ubuntu-24.04
        environment:
            name: ${{ inputs.environment }}
            url: ${{ inputs.url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: yarn

            - run: yarn install

            - name: Typecheck
              run: yarn typecheck

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: /tmp/composer-cache
                  key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2

            - name: Install dependencies
              run: composer install --no-dev --no-interaction --no-progress
              env:
                  COMPOSER_CACHE_DIR: /tmp/composer-cache

            - name: Build
              run: yarn run build
              env:
                  APP_BASE_PATH: ${{ inputs.app_base_path }}

            - name: Deploy
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  deploy_key: ${{ secrets.deploy_key }}
                  external_repository: ${{ inputs.external_repository }}
                  publish_dir: ./dist
                  cname: ${{ inputs.cname }}
